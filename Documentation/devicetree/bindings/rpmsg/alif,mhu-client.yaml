---
$id: http://devicetree.org/schemas/rpmsg/alif,mhu-client.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM MHUv2 RPMSG mailbox Client
description: ARM MHUv2 RPMSG mailbox Client

maintainers:
  - Hemanth Kumar <hemanth@alifsemi.com>

properties:
  compatible:
    enum:
      - arm,client

  mboxes:
    description: |
      List of phandles to mailbox channels used for receiving and
      transmitting data from and to the hardware UART.
    minItems: 12
    maxItems: 12

  mbox-names:
    items:
      - const: txdb0
      - const: txdb1
      - const: rxdb0
      - const: rxdb1
      - const: txdb2
      - const: txdb3
      - const: rxdb2
      - const: rxdb3
      - const: txdb4
      - const: txdb5
      - const: rxdb4
      - const: rxdb5

required:
  - compatible
  - mbox-names
  - mboxes

additionalProperties: false

examples:
  - |
    client {
        compatible = "arm,client";
        mbox-names = "txdb0", "txdb1",
                     "rxdb0", "rxdb1",
                     "txdb2", "txdb3",
                     "rxdb2", "rxdb3",
                     "txdb4", "txdb5",
                     "rxdb4", "rxdb5";
        mboxes = <&mbox_m55_hp_mhu0_tx 0 0>,
                 <&mbox_m55_hp_mhu1_tx 0 0>,
                 <&mbox_m55_hp_mhu0_rx 0 0>,
                 <&mbox_m55_hp_mhu1_rx 0 0>,
                 <&mbox_m55_he_mhu0_tx 0 0>,
                 <&mbox_m55_he_mhu1_tx 0 0>,
                 <&mbox_m55_he_mhu0_rx 0 0>,
                 <&mbox_m55_he_mhu1_rx 0 0>,
                 <&mbox_se_mhu0_tx 0 0>,
                 <&mbox_se_mhu1_tx 0 0>,
                 <&mbox_se_mhu0_rx 0 0>,
                 <&mbox_se_mhu1_rx 0 0>;
    };
