%YAML 1.2
---
$id: http://devicetree.org/schemas/media/alif,ensemble-cpi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Alif Ensemble Camera Parallel Interface (CPI)

maintainers:
  - Yogender Kumar Arya <yogender.kumar@alifsemi.com>

properties:
  compatible:
    enum:
      - alif,ensemble-cpi
      - alif,ensemble-cpi2

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: apb_clk
      - const: pix_clk

  memory-region:
    description:
      Phandle to a reserved-memory region used for CPI frame buffers.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: Input port receiving from the CSI-2 controller.
        properties:
          endpoint:
            $ref: video-interfaces.yaml#
            unevaluatedProperties: false
            properties:
              bus-type:
                const: 4
              remote-endpoint: true

      port@1:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: Output port to the next processing stage.
        properties:
          endpoint:
            $ref: video-interfaces.yaml#
            unevaluatedProperties: false
            properties:
              bus-type:
                const: 4
              remote-endpoint: true

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    camera-controller@49030000 {
        compatible = "alif,ensemble-cpi2";
        reg = <0x49030000 0x1000>;
        interrupt-parent = <&gic>;
        interrupts = <GIC_SPI 334 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&psclks 104>, <&psclks 61>;
        clock-names = "apb_clk", "pix_clk";
        memory-region = <&cpi_buf>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                endpoint {
                    bus-type = <4>;
                    remote-endpoint = <&csi_out>;
                };
            };

            port@1 {
                reg = <1>;
                endpoint {
                    bus-type = <4>;
                    remote-endpoint = <&cpi_out>;
                };
            };
        };
    };
