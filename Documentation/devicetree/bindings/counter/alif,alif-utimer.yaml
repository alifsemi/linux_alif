%YAML 1.2
---
$id: http://devicetree.org/schemas/counter/alif,alif-utimer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Alif Semiconductor UTIMER (Unified Timer) Module

maintainers:
  - Hemanth Kumar <hemanth@alifsemi.com>

description: |
  The Alif UTIMER is a unified timer/counter module with multiple channels,
  each supporting independent start/stop/clear controls and
  interrupt generation.

properties:
  compatible:
    const: alif,alif-utimer

  reg:
    maxItems: 1
    description: |
      Physical base address and size of the UTIMER register set.

  interrupts:
    minItems: 1
    maxItems: 96
    description: |
      List of interrupts, one per timer channel, in ascending order (e.g.,
      Channel 0 = interrupts[0], Channel 1 = interrupts[1], etc.).

  clocks:
    maxItems: 1
    description: |
      AXI clock phandle for the timer module.

  clock-names:
    const: axi_clk

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/alif,ensemble-clock.h>

    utimer: timer@48000000 {
        compatible = "alif,alif-utimer";
        reg = <0x48000000 0x100000>;
        interrupt-parent = <&gic>;
        interrupts = <GIC_SPI 366 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 367 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 368 IRQ_TYPE_EDGE_RISING>,
