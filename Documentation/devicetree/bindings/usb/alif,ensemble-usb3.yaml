%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/alif,ensemble-usb3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Alif Ensemble DWC3 USB Controller

maintainers:
  - Hemanth Kumar <hemanth@alifsemi.com>

properties:
  compatible:
    enum:
      - alif,ensemble-usb3

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

  status:
    enum:
      - okay
      - disabled

  clock-names:
    items:
      - const: usb_clk
      - const: dwc_clk

  clocks:
    items:
      - description: Handle to ENSEMBLE_USB_CLK
      - description: Handle to ENSEMBLE_DWC_USB_CLK

patternProperties:
  "^usb@.*$":
    type: object
    description: |
      USB Dual Role Device node for the DWC3 controller.
    additionalProperties: false
    properties:
      compatible:
        items:
          - const: snps
          - const: snps,dwc3

      reg:
        items:
          - description: Base address and size of the DWC3 controller.

      interrupts:
        maxItems: 1
        description: Interrupt specifier for the DWC3 controller.

      phy:
        description: Handle to the PHY used by the DWC3 controller.

      phys:
        description: Handle to the PHY used by the DWC3 controller.

      phy-names:
        const: usb2_phy

      dr_mode:
        enum:
          - host
          - peripheral
          - otg

      snps,hsphy_interface:
        const: utmi

      phy_type:
        const: utmi_wide

      maximum-speed:
        enum:
          - high-speed
          - super-speed
          - super-speed-plus

      snps,dis_u3_susphy_quirk:
        type: boolean
        description: Disable USB 3.0 suspend PHY quirk.

      snps,dis_u2_susphy_quirk:
        type: boolean
        description: Disable USB 2.0 suspend PHY quirk.

      snps,incr-burst-type-adjustment:
        minItems: 1
        maxItems: 4
        items:
          type: integer
        description: |
          Adjustment of burst types: supported values are 1, 4, 8, 16.

      snps,quirk-frame-length-adjustment:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Frame length adjustment quirk value.

      snps,usb2-lpm-disable:
        type: boolean
        description: Disable USB2 LPM support.

required:
  - compatible
  - "#address-cells"
  - "#size-cells"
  - ranges
  - status
  - clock-names
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/alif,ensemble-clock.h>

    hsusb: dwc3-drd {
        compatible = "alif,ensemble-usb3";
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;
        status = "disabled";
        clock-names = "usb_clk", "dwc_clk";
        clocks = <&psclks ENSEMBLE_USB_CLK>, <&psclks ENSEMBLE_DWC_USB_CLK>;

        dwc3: usb@48200000 {
            compatible = "snps", "snps,dwc3";
            reg = <0x48200000 0x100000>;
            interrupts = <GIC_SPI 26 IRQ_TYPE_LEVEL_HIGH>;
            phy = <&psclks ENSEMBLE_USB_CLK>;
            phy-names = "usb2_phy";
            dr_mode = "peripheral";
            snps,hsphy_interface = "utmi";
            phy_type = "utmi_wide";
            maximum-speed = "high-speed";
            snps,dis_u3_susphy_quirk;
            snps,dis_u2_susphy_quirk;
            snps,incr-burst-type-adjustment = <1>, <4>, <8>, <16>;
            snps,quirk-frame-length-adjustment = <0x20>;
            snps,usb2-lpm-disable;
        };
    };
